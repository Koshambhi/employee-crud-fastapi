<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Manager - Premium</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="content">

    <!-- HEADER WITHOUT SIDEBAR & WITHOUT V ICON -->
    <header class="topbar">
        <h1>Employee Management System</h1>
    </header>

    <!-- ADD EMPLOYEE CARD -->
    <div class="card form-card">
        <h2 id="form-title" tabindex="-1">Add Employee</h2>

        <p id="required-hint">Fields marked * are required.</p>

        <form id="employee-form" class="form-grid" novalidate aria-labelledby="form-title" aria-describedby="required-hint">

            <input type="hidden" id="emp-id">

            <div>
                <label for="name">Name <span class="required-mark" aria-hidden="true">*</span></label>
                <input type="text" id="name" name="name" autocomplete="name" maxlength="100" required aria-required="true" aria-describedby="name-error">
                <span id="name-error" class="field-error"></span>
            </div>

            <div>
                <label for="age">Age <span class="required-mark" aria-hidden="true">*</span></label>
                <input type="number" id="age" name="age" autocomplete="off" min="18" max="100" step="1" required aria-required="true" aria-describedby="age-error">
                <span id="age-error" class="field-error"></span>
            </div>

            <div>
                <label for="position">Position <span class="required-mark" aria-hidden="true">*</span></label>
                <input type="text" id="position" name="position" autocomplete="organization-title" maxlength="100" required aria-required="true" aria-describedby="position-error">
                <span id="position-error" class="field-error"></span>
            </div>

            <div>
                <label for="department">Department <span class="required-mark" aria-hidden="true">*</span></label>
                <input type="text" id="department" name="department" autocomplete="off" maxlength="100" required aria-required="true" aria-describedby="department-error">
                <span id="department-error" class="field-error"></span>
            </div>

            <div>
                <label for="email">Email <span class="required-mark" aria-hidden="true">*</span></label>
                <input type="email" id="email" name="email" autocomplete="email" maxlength="100" required aria-required="true" aria-describedby="email-error">
                <span id="email-error" class="field-error"></span>
            </div>

            <div>
                <label for="salary">Salary <span class="required-mark" aria-hidden="true">*</span></label>
                <input type="number" id="salary" name="salary" autocomplete="off" min="0" max="10000000" step="any" required aria-required="true" aria-describedby="salary-error">
                <span id="salary-error" class="field-error"></span>
            </div>

            <div>
                <label for="experience">Experience (Years) <span class="required-mark" aria-hidden="true">*</span></label>
                <input type="number" id="experience" name="experience" autocomplete="off" min="0" max="80" step="1" required aria-required="true" aria-describedby="experience-error">
                <span id="experience-error" class="field-error"></span>
            </div>

            <div class="form-actions">
                <button type="submit" id="submit-btn">Add Employee</button>
                <button type="button" id="cancel-btn" hidden>Cancel</button>
            </div>
        </form>

        <div id="feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true"></div>
        <div id="feedback-error" class="feedback" aria-live="assertive" aria-atomic="true"></div>
    </div>

    <!-- TABLE -->
    <div class="card table-card">
        <h2>All Employees</h2>

        <table>
            <caption class="sr-only">Employee list</caption>
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Name</th>
                    <th scope="col">Age</th>
                    <th scope="col">Position</th>
                    <th scope="col">Department</th>
                    <th scope="col">Email</th>
                    <th scope="col">Salary</th>
                    <th scope="col">Experience</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<script src="/static/script.js"></script>
</body>
</html>
